name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches modVersion
        id: version
        shell: bash
        run: |
          version=$(grep -E '^[[:space:]]*modVersion[[:space:]]*=' gradle.properties | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "modVersion is missing from gradle.properties"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match modVersion '$version'."
            echo "Use a tag such as v$version (or $version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build --no-daemon --no-configuration-cache

      - name: Prepare release files and notes
        id: notes
        shell: bash
        run: |
          mkdir -p release
          cp "build/libs/modernui-gtnh-${{ steps.version.outputs.version }}.jar" release/
          awk 'BEGIN{p=0} /^## \[/{if(p){exit} p=1} p' CHANGELOG-USER.md > release/CHANGELOG.md
          printf '\n\nSee full changelog: https://github.com/nhx100218/ModernUI-GTNH/blob/main/CHANGELOG.md\n' >> release/CHANGELOG.md
          {
            echo 'text<<__NOTES_EOF__'
            cat release/CHANGELOG.md
            echo '__NOTES_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Attach jar and update release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: ModernUI-GTNH ${{ steps.version.outputs.version }}
          body_path: release/CHANGELOG.md
          files: release/modernui-gtnh-${{ steps.version.outputs.version }}.jar

      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CurseForge }}
          project_id: '1835100'
          game_endpoint: minecraft
          file_path: release/modernui-gtnh-${{ steps.version.outputs.version }}.jar
          game_versions: '1.7.10,Forge'
          release_type: release
          changelog: ${{ steps.notes.outputs.text }}
          changelog_type: markdown
          display_name: ModernUI-GTNH ${{ steps.version.outputs.version }}
