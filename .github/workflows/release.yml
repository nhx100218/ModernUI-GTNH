name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || !contains(github.event.release.body, 'ModernUI-GTNH auto release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches modVersion
        id: version
        shell: bash
        run: |
          version=$(grep -E '^[[:space:]]*modVersion[[:space:]]*=' gradle.properties | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "modVersion is missing from gradle.properties"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match modVersion '$version'."
            echo "Use a tag such as v$version (or $version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build --no-daemon --no-configuration-cache

      - name: Prepare release files and notes
        shell: bash
        run: |
          mkdir -p release
          cp "build/libs/modernui-gtnh-${{ steps.version.outputs.version }}.jar" release/
          awk 'BEGIN{p=0} /^## \[/{if(p){exit} p=1} p' CHANGELOG-USER.md > release/CHANGELOG.md
          printf '\n\nSee full changelog: https://github.com/nhx100218/ModernUI-GTNH/blob/main/CHANGELOG.md\n' >> release/CHANGELOG.md
          cp release/CHANGELOG.md release/GITHUB_RELEASE.md
          printf '\n\n<!-- ModernUI-GTNH auto release -->\n' >> release/GITHUB_RELEASE.md

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ModernUI-GTNH ${{ steps.version.outputs.version }}
          body_path: release/GITHUB_RELEASE.md
          files: release/modernui-gtnh-${{ steps.version.outputs.version }}.jar
          draft: false
          prerelease: false

      - name: Upload to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: '1835100'
          curseforge-token: ${{ secrets.CurseForge }}
          files: release/modernui-gtnh-${{ steps.version.outputs.version }}.jar
          name: ModernUI-GTNH ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          changelog-file: release/CHANGELOG.md
          loaders: forge
          game-versions: 1.7.10
          game-version-filter: releases
          fail-mode: fail
