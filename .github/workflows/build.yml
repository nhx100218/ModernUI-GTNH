name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ '*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read mod version
        id: version
        shell: bash
        run: |
          version=$(grep -E '^[[:space:]]*modVersion[[:space:]]*=' gradle.properties | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "modVersion is missing from gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build --no-daemon --no-configuration-cache

      - name: Collect release artifact
        run: |
          mkdir -p release
          cp "build/libs/modernui-gtnh-${{ steps.version.outputs.version }}.jar" release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modernui-gtnh
          path: release/*.jar
          if-no-files-found: error

      - name: Compute release metadata
        if: startsWith(github.ref, 'refs/tags/')
        id: meta
        shell: bash
        run: |
          msg=$(git log -1 --pretty=%B)
          subject=$(printf '%s\n' "$msg" | head -n 1)
          {
            echo "subject<<__EOF__"
            echo "$subject"
            echo "__EOF__"
            echo "body<<__EOF__"
            echo "$msg"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.subject }}
          body: ${{ steps.meta.outputs.body }}
          files: release/*.jar
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
