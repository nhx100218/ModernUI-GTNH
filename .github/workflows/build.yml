name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --no-configuration-cache

      - name: Collect release artifact
        run: |
          mkdir -p release
          find build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-dev.jar' ! -name '*-dev-preshadow.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-api.jar' \
            -exec cp {} release/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modernui-gtnh
          path: release/*.jar
          if-no-files-found: error

      - name: Compute release metadata
        if: github.event_name == 'push'
        id: meta
        shell: bash
        run: |
          msg=$(git log -1 --pretty=%B)
          subject=$(printf '%s\n' "$msg" | head -n 1)
          {
            echo "subject<<__EOF__"
            echo "$subject"
            echo "__EOF__"
            echo "body<<__EOF__"
            echo "$msg"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: ${{ steps.meta.outputs.subject }}
          body: ${{ steps.meta.outputs.body }}
          files: release/*.jar
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
